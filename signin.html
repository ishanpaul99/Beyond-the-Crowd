<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In</title>

    <link rel="stylesheet" href="signin.css">

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

</head>


<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

        <!-- Logo + Website Name -->

        <div class="brand">

            <div class="logo">
                <a href="index.html">
                    <img src="images/web-logo.png" alt="logo" width="65px">
                </a>
            </div>

            <div class="website-name">
                    <a href="index.html"><img src="images/web-name.png" alt="web-name" width="100px"></a>
            </div>

        </div>


        <!-- Navigation Links -->

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="index.html#features">
                Features
            </a>

            <a href="about.html">
                About
            </a>

        </div>

    </nav>



    <!-- ================= SIGN IN ================= -->

    <main class="signin-page">

        <section class="signin-card">

            <h2>
                Welcome back.
            </h2>

            <!-- Sign In Form -->

            <form class="signin-form">


                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- Forgot Password -->

                <div class="forgot-password">

                    <a href="#">
                        Forgot your password?
                    </a>

                </div>


                <!-- Sign In Button -->

                <button
                    type="submit"
                    class="signin-button"
                >
                    Sign In
                </button>

            </form>


            <!-- Register -->

            <p class="register-text">

                Don't have an account?

                <a href="register.html">
                    Register
                </a>

            </p>

        </section>

    </main>


</body>

</html>
